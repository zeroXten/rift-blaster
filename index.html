<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Rift Blaster</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game" width="427" height="240"></canvas>
<video id="cam" playsinline muted autoplay></video>
<div id="safe"></div>
<div id="rotate"><p>TURN YOUR PHONE SIDEWAYS<br><small>The scanner is held in both hands.<br>If nothing happens, switch off rotation lock, or tap here.</small></p></div>
<noscript><p class="nojs">Rift Blaster needs JavaScript.</p></noscript>
<script type="module">
  // The host (GitHub Pages) lets a browser reuse each file for ten minutes without asking, and a
  // phone's reload button does not override that for scripts, so a fresh deploy can keep showing
  // the old game. Before starting, ask the server about every module the game imports; unchanged
  // files cost one tiny request each, changed ones are replaced in the browser's cache.
  //
  // The same pass notes when the newest of those files was last changed on the server. The title
  // screen shows that as the build, so it is easy to tell whether the latest version has loaded.
  const seen = new Set();
  let newest = Date.parse(document.lastModified) || 0;
  const check = url => fetch(url, { cache: 'no-cache' }).then(r => {
    newest = Math.max(newest, Date.parse(r.headers.get('last-modified')) || 0);
    return r.text();
  });
  const refresh = url => {
    if (seen.has(url)) return null;
    seen.add(url);
    return check(url).then(text =>
      Promise.all([...text.matchAll(/from\s+'(\.[^']+)'/g)].map(m => refresh(new URL(m[1], url).href))));
  };
  Promise.all([refresh(new URL('js/main.js', location.href).href), check('css/style.css')])
    .catch(() => {})
    .then(() => {
      window.riftBuild = newest;
      return import('./js/main.js');
    });
</script>
</body>
</html>
